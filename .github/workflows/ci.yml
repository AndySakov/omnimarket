name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The input-log integration tests record to Kafka and replay (D72); the engine's end-to-end
    # test also archives its recording to RustFS (D75) and replays it from there.
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-retries 30
      rustfs:
        image: rustfs/rustfs:1.0.0
        ports: ["9000:9000"]
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: omnimarket
          RUSTFS_SECRET_KEY: omnimarket-dev
        # A named volume, as the local stack has: it takes the image's ownership of /data, and
        # RustFS doesn't run as root.
        volumes: ["rustfs-data:/data"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # buf breaking compares proto/ against main's.
      - run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The pinned buf binary (scripts/buf downloads it into .tools/). Keyed on the script, which pins
      # its version and checksum, so a version bump downloads once and every other run skips GitHub's
      # release CDN, whose 5xx errors failed verify runs (#107).
      - uses: actions/cache@v4
        with:
          path: .tools
          key: buf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/buf') }}
      # The criteria job reads which tests passed from these logs (D95).
      # `shell: bash` adds pipefail, so a failing command still fails its step through `tee`.
      - shell: bash
        run: mkdir -p test-reports && scripts/verify.sh | tee test-reports/verify.log
      - shell: bash
        run: cargo test -p sim --test kafka -- --ignored | tee test-reports/kafka.log
      # The archive's bucket, as `scripts/stack up` creates it. 409: it already exists.
      - shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user omnimarket:omnimarket-dev http://localhost:9000/omnimarket-inputs)
          [[ $code == 200 || $code == 409 ]] || { echo "creating the archive bucket failed ($code)" >&2; exit 1; }
          cargo test -p engine --test end_to_end -- --ignored | tee test-reports/engine-end-to-end.log
      - uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: test-reports/

  # The terminal UI's full checks (D86). verify.sh leaves web/terminal/ to this job.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/terminal/package-lock.json
      # api:check runs scripts/buf generate (#75); the same cache as verify's, so neither job
      # depends on GitHub's release CDN once buf has been downloaded.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: buf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/buf') }}
      - name: Install frontend dependencies
        working-directory: web/terminal
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web/terminal
        run: npx playwright install --with-deps chromium
      - name: Verify frontend
        working-directory: web/terminal
        run: npm run verify:pr
      # The criteria job reads which tests passed from these (D95).
      - name: List the frontend tests that passed
        run: |
          mkdir -p test-reports
          scripts/frontend-passed-tests.sh > test-reports/frontend.log
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-reports/
      - name: Upload frontend reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            web/terminal/playwright-report
            web/terminal/test-results
            web/terminal/storybook-static

  # Every path a PR changes has the docs CLAUDE.md's update table names for it changed too, or the PR
  # body waives one with a line `Docs unchanged: <doc>: <reason>` (#135). The body is read when the job
  # runs, so after adding a waiver, re-run this job alone.
  update-table:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The PR merged into its base; the merge's first parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check the update table
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > pr-body.md
          scripts/check-update-table --base HEAD^1 --head HEAD --body pr-body.md --summary "$GITHUB_STEP_SUMMARY"

  # Every acceptance criterion of the issue a PR closes names the test that proves it, and that
  # test passed in this run (D95). The PR body and the issues are read when the job runs, so after
  # editing the body, re-run this job alone.
  criteria:
    if: github.event_name == 'pull_request'
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet -p criteria
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-test-results"
          path: test-results
      - name: Check the acceptance criteria
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p issues
          gh api "repos/$REPO/pulls/$PR" --jq .body > pr-body.md
          for n in $(target/debug/criteria closes pr-body.md); do
            gh api "repos/$REPO/issues/$n" --jq '.body // ""' > "issues/$n.md"
          done
          status=0
          target/debug/criteria check pr-body.md issues test-results/*/*.log > summary.md || status=$?
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Each D-entry a PR adds to docs/spec/decisions.md is reserved in the D-number ledger, and on neither
  # main nor another open PR (docs/agents/process.md, "Coordination between workers").
  d-numbers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The PR merged into its base; the merge's first parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check the D-numbers
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/work check-d --base HEAD^1 --head HEAD --pr "$PR" --summary "$GITHUB_STEP_SUMMARY"
