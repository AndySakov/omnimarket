name: Mutants

# Mutation testing (D89): which mutants of the code no test catches.
# - On every PR: only mutants in the PR's changed code, a fresh verdict. A PR with no Rust in its
#   diff stops before building anything. The `mutants` job then fails the PR on a missed mutant its
#   body gives no reason for (#137).
# - Nightly on main: every mutant not already caught. The ledger of caught mutants is cached
#   per ISO week, so the first run each week tests everything again.
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          # --diff needs the merge base with the PR's base branch.
          fetch-depth: 0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: keys
        run: |
          echo "toolchain=${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The workers' target dirs: a run rebuilds only what changed since the cached one.
      - uses: actions/cache/restore@v4
        with:
          path: target/mutants/targets
          key: mutants-targets-${{ steps.keys.outputs.toolchain }}-${{ github.run_id }}
          restore-keys: mutants-targets-${{ steps.keys.outputs.toolchain }}-
      - uses: actions/cache/restore@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            target/mutants/ledger.txt
            target/mutants/ledger.from
          key: mutants-ledger-${{ steps.keys.outputs.week }}-${{ github.run_id }}
          restore-keys: mutants-ledger-${{ steps.keys.outputs.week }}-
      # Exit 2 means mutants were missed or timed out: that's the report, not a failed run. The
      # `mutants` job judges a PR's misses.
      - name: Mutants in this PR's changes
        if: github.event_name == 'pull_request'
        run: scripts/mutants.sh --diff "origin/${{ github.base_ref }}" || [ $? -eq 2 ]
      - name: Mutants across the workspace
        if: github.event_name != 'pull_request'
        run: scripts/mutants.sh || [ $? -eq 2 ]
      - name: Summary
        if: always()
        run: cat target/mutants/last/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: |
            target/mutants/last
            target/mutants/runs/*.log
          if-no-files-found: ignore
      # Saved from main's runs only, even when mutants were missed, so the next run and every PR
      # start warm. PRs restore it without saving, so they don't fill the repository's cache.
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request'
        with:
          path: target/mutants/targets
          key: mutants-targets-${{ steps.keys.outputs.toolchain }}-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request'
        with:
          path: |
            target/mutants/ledger.txt
            target/mutants/ledger.from
          key: mutants-ledger-${{ steps.keys.outputs.week }}-${{ github.run_id }}

  # Every mutant the PR's run missed has a row in the PR body's "Missed mutants" table giving the
  # reason no test catches it (#137). Timed-out mutants are listed, not failed (#145). The body is
  # read when the job runs, so after editing it, re-run this job alone: the mutants aren't run again.
  mutants:
    if: always() && github.event_name == 'pull_request'
    needs: mutation-testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet -p criteria
      - uses: actions/download-artifact@v4
        if: needs.mutation-testing.result == 'success'
        with:
          name: mutants
          path: mutants
      # One step, so the watchdog's brief finds the run's summary and the check under one heading.
      - name: Check each missed mutant has a reason
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ needs.mutation-testing.result }}
        run: |
          if [ "$RUN" != success ]; then
            echo "The mutation-testing job ended in $RUN, so there's no list of missed mutants to check." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat mutants/last/summary.md
          echo
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > pr-body.md
          missed=mutants/last/missed.txt
          [ -f "$missed" ] || missed=/dev/null
          status=0
          target/debug/criteria mutants pr-body.md "$missed" > reasons.md || status=$?
          cat reasons.md
          cat reasons.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
