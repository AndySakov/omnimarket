syntax = "proto3";

package omnimarket.chain.v1;

import "omnimarket/chain/v1/block.proto";

// The outcome of a ranged log read (`eth_getLogs`), as the core receives it. Transport failures
// and rate limits are retried below the core and never reach it.
message LogsResult {
  oneof outcome {
    BlockLogs returned = 1;
    // The node refused the read (e.g. as too large), or it returned more logs than one read may.
    string failed = 2;
  }
}

message BlockLogs {
  // In block and log order.
  repeated BlockLog logs = 1;
}

// A log from a ranged read, with its block.
message BlockLog {
  uint64 block_number = 1;
  bytes block_hash = 2;
  uint64 block_timestamp = 3;
  Log log = 4;
}
