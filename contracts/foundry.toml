[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# The safety probe's runtime code is committed for the API to inject (#89): no metadata hash, so
# the same source always builds the same bytes.
bytecode_hash = "none"
cbor_metadata = false
