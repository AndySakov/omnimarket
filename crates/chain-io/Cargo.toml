[package]
name = "chain-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alloy = { workspace = true, features = ["std", "provider-http", "rpc-types", "reqwest-rustls-tls"] }
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
types.workspace = true

[dev-dependencies]
# The fault tests' scripted node is an alloy transport: JSON-RPC packets in, answers out.
alloy = { workspace = true, features = ["json-rpc"] }
det.workspace = true
serde_json.workspace = true
tower-service = "0.3"

[lints]
workspace = true
