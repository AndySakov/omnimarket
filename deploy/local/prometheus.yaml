global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: pyroscope
    static_configs: [{targets: ["pyroscope:4040"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  # The engine and API run on the host (cargo run), so they're down unless you started them.
  - job_name: engine
    static_configs: [{targets: ["host.docker.internal:9464"]}]
  - job_name: api
    static_configs: [{targets: ["host.docker.internal:8080"]}]
