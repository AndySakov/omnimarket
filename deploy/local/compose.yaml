# Local dev stack (D70, D75). Start and stop it with scripts/stack.
name: omnimarket

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: omnimarket
      POSTGRES_PASSWORD: omnimarket
      POSTGRES_DB: omnimarket
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "omnimarket"]
      interval: 2s
      retries: 30

  # Single-node KRaft; the image's defaults advertise localhost:9092 for clients on the host.
  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: omnimarket
      RUSTFS_SECRET_KEY: omnimarket-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfs:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 30

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    ports: ["3200:3200", "4317:4317", "4318:4318"]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports: ["3000:3000"]
    depends_on: [tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      retries: 30

  # A fork of Base mainnet. Set BASE_RPC_URL to use your own endpoint instead of the public one.
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--fork-url", "${BASE_RPC_URL:-https://mainnet.base.org}"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      retries: 60

volumes:
  postgres:
  rustfs:
  tempo:
