[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/proto",
  "crates/det",
  "crates/telemetry",
  "crates/chain-io",
  "crates/venues",
  "crates/engine",
  "crates/sim",
  "crates/criteria",
  "crates/pricing",
  "crates/api",
]
exclude = ["scripts/fixtures/determinism"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
types = { path = "crates/types" }
det = { path = "crates/det" }
proto = { path = "crates/proto" }
telemetry = { path = "crates/telemetry" }
chain-io = { path = "crates/chain-io" }
engine = { path = "crates/engine" }
venues = { path = "crates/venues" }
pricing = { path = "crates/pricing" }
alloy = { version = "2.5", default-features = false }
alloy-primitives = "1.7"
alloy-sol-types = "1.7"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1.8"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
object_store = { version = "0.14", default-features = false }
getrandom = "0.4"
opentelemetry = "0.33"
pbjson = "0.9"
pbjson-build = "0.9"
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = "0.33"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
rand_chacha = "0.10"
rand_core = "0.10"
rdkafka = "0.39"
serde = "1"
serde_json = "1"
tokio = { version = "1.53", default-features = false }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

# Mutation testing (D89, scripts/mutants.sh). No debug info: every mutant is an incremental
# build plus a test run, and a failing test is the expected outcome, so backtraces aren't needed.
[profile.mutants]
inherits = "test"
debug = "none"
