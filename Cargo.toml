[workspace]
resolver = "3"
members = ["crates/types", "crates/proto", "crates/det", "crates/sim"]
exclude = ["scripts/fixtures/determinism"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
types = { path = "crates/types" }
det = { path = "crates/det" }
proto = { path = "crates/proto" }
blake3 = "1.8"
futures = "0.3"
getrandom = "0.4"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
rand_chacha = "0.10"
rand_core = "0.10"
rdkafka = "0.39"
tokio = { version = "1.53", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
